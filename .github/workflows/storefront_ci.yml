name: Customer Storefront CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: storefront-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build and validate staging artifact
        run: npm run build
        env:
          YOMART_BUILD_ENV: staging
          VITE_API_BASE_URL: https://yomart-api.onrender.com
          YOMART_EXPECTED_API_ORIGIN: https://yomart-api.onrender.com
          VITE_EXPECTED_SITE_ORIGIN: https://yomart.onrender.com
          YOMART_PRODUCTION_API_ORIGINS: ""
          YOMART_PRODUCTION_SITE_ORIGINS: ""

      - name: Set up Chrome for live UI evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: browser-actions/setup-chrome@v1

      - name: Capture real deployed storefront and admin screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/live-ui
          curl --fail --silent --show-error --retry 18 --retry-delay 10 --retry-all-errors --max-time 20 https://yomart.onrender.com/ -o /dev/null
          curl --fail --silent --show-error --retry 18 --retry-delay 10 --retry-all-errors --max-time 20 https://yomart-admin.onrender.com/ -o /dev/null
          for route in products cart login support; do
            curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors --max-time 20 "https://yomart.onrender.com/${route}" -o /dev/null
          done
          chrome --version
          chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=20000 --window-size=1440,1100 --screenshot=artifacts/live-ui/storefront-desktop.png https://yomart.onrender.com/
          chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=20000 --window-size=390,844 --screenshot=artifacts/live-ui/storefront-mobile.png https://yomart.onrender.com/
          chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=20000 --window-size=1440,1100 --screenshot=artifacts/live-ui/admin-desktop.png https://yomart-admin.onrender.com/
          chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=20000 --window-size=390,844 --screenshot=artifacts/live-ui/admin-mobile.png https://yomart-admin.onrender.com/
          chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=20000 --window-size=1440,1100 --screenshot=artifacts/live-ui/storefront-products-desktop.png https://yomart.onrender.com/products
          chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=20000 --window-size=390,844 --screenshot=artifacts/live-ui/storefront-products-mobile.png https://yomart.onrender.com/products
          chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=20000 --window-size=390,844 --screenshot=artifacts/live-ui/storefront-cart-mobile.png https://yomart.onrender.com/cart
          chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=20000 --window-size=390,844 --screenshot=artifacts/live-ui/storefront-login-mobile.png https://yomart.onrender.com/login
          chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=20000 --window-size=1440,1100 --screenshot=artifacts/live-ui/storefront-support-desktop.png https://yomart.onrender.com/support

      - name: Upload genuine deployed UI screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: yomart-live-web-screenshots
          path: artifacts/live-ui/*.png
          if-no-files-found: error
          retention-days: 30
