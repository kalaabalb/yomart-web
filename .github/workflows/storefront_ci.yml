name: Customer Storefront CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: storefront-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build and validate staging artifact
        run: npm run build
        env:
          YOMART_BUILD_ENV: staging
          VITE_API_BASE_URL: https://yomart-api.onrender.com
          YOMART_EXPECTED_API_ORIGIN: https://yomart-api.onrender.com
          VITE_EXPECTED_SITE_ORIGIN: https://yomart.onrender.com
          YOMART_PRODUCTION_API_ORIGINS: ""
          YOMART_PRODUCTION_SITE_ORIGINS: ""
